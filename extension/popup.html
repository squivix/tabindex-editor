<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    width: 260px; margin: 0; padding: 14px;
    font: 13px/1.5 system-ui, -apple-system, sans-serif;
    background: #1f2937; color: #f9fafb;
  }
  h1 { font-size: 14px; margin: 0 0 4px; }
  .site { color: #9ca3af; font-size: 12px; word-break: break-all; margin-bottom: 10px; }
  .status { margin-bottom: 10px; font-size: 12px; color: #d1d5db; }
  button {
    display: block; width: 100%; margin-bottom: 6px; padding: 7px 10px;
    border: 0; border-radius: 6px; font-size: 13px; cursor: pointer;
    background: #374151; color: #f9fafb; text-align: left;
  }
  button.primary { background: #2563eb; font-weight: 600; }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:disabled { opacity: .45; cursor: default; }
  .hint { color: #9ca3af; font-size: 11px; margin-top: 8px; }
  kbd {
    background: #374151; border-radius: 3px; padding: 0 4px;
    font-family: inherit; font-size: 11px;
  }
  .error { color: #fca5a5; font-size: 12px; }
</style>
</head>
<body>
  <h1>TabIndex Editor</h1>
  <div class="site" id="site">…</div>
  <div class="status" id="status"></div>
  <button class="primary" id="toggle">Edit tab order</button>
  <button id="clear-page" disabled>Clear rules for this page</button>
  <button id="clear-site" disabled>Clear rules for this site</button>
  <div class="hint">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>K</kbd></div>
  <script src="popup.js"></script>
</body>
</html>
